<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестирование уведомлений</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Тестирование API уведомлений</h1>
    
    <!-- Создание уведомления -->
    <div class="section">
        <h2>Создать уведомление</h2>
        <form id="createForm">
            <label>Канал:</label>
            <select id="channel" required>
                <option value="email">Email</option>
                <option value="telegram">Telegram</option>
            </select>
            
            <label>Получатель:</label>
            <input type="text" id="recipient" placeholder="email или ID Telegram" required>
            
            <label>Сообщение:</label>
            <textarea id="message" rows="3" placeholder="Текст сообщения" required></textarea>
            
            <label>Дата и время отправки:</label>
            <input type="datetime-local" id="scheduledAt" required>
            
            <button type="submit">Создать уведомление</button>
        </form>
        <div id="createResult" class="result"></div>
    </div>
    
    <!-- Получение статуса уведомления -->
    <div class="section">
        <h2>Получить статус уведомления</h2>
        <form id="getForm">
            <label>ID уведомления:</label>
            <input type="number" id="notificationId" placeholder="Введите ID уведомления" required>
            <button type="submit">Получить статус</button>
        </form>
        <div id="getResult" class="result"></div>
    </div>
    
    <!-- Удаление уведомления -->
    <div class="section">
        <h2>Удалить уведомление</h2>
        <form id="deleteForm">
            <label>ID уведомления:</label>
            <input type="number" id="deleteNotificationId" placeholder="Введите ID уведомления" required>
            <button type="submit">Удалить уведомление</button>
        </form>
        <div id="deleteResult" class="result"></div>
    </div>

       <script src="app.js"></script>
</body>
</html>
