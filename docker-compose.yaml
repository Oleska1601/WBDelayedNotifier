services:

  postgres:
    container_name: postgres
    image: postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${DB_POSTGRES_HOST}
      POSTGRES_USER: ${DB_POSTGRES_USERNAME}    
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD} 
      POSTGRES_DB: ${DB_POSTGRES_DATABASE}      
    volumes:
      - postgres-data:/var/lib/postgresql # создание хранилища (без него все данные исчезнут после перезапуска контейнера)
    ports:
      - "5432:5432"
    restart: always
    networks:
      - notifier_network
  
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data  
    networks:
      - notifier_network

  rabbitmq:
    image: rabbitmq
    container_name: rabbitmq
    build: 
      context: .
      dockerfile: Dockerfile.rabbitmq
    ports:
      - "5672:5672"   
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
    restart: always
    networks:
      - notifier_network

  notifier:
    container_name: notifier
    image: notifier
    env_file:
      .env
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - postgres 
      - redis
      - rabbitmq
    restart: unless-stopped     
    networks:
      - notifier_network

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  rabbitmq-logs:

networks:
  notifier_network:
    driver: bridge 
